
apiVersion: apps/v1
kind: Deployment

metadata:
  name: todo-deployment

spec:
  replicas: 2

  selector:
    matchLabels:
      app: todo

  template:
    metadata:
      labels:
        app: todo

    spec:
      containers:
      - name: todo-container
        image: todo-app:1.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
